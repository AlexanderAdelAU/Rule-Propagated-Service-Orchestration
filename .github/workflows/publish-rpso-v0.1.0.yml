name: Publish RPSO v0.1.0 Windows Release

# The first merge of this workflow onto main publishes the initial release.
# A manual rerun is safe: an existing v0.1.0 release is left untouched.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-rpso-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Apache Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant

      - name: Compile and assemble Windows distribution
        run: ant -noinput -f release/build.xml dist

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          archive=release/dist/RPSO-v0.1.0-Windows.zip
          test -s "$archive"
          unzip -tq "$archive"
          for required in \
              START_RPSO.bat \
              README-FIRST.md \
              btsn.workflowEditor/dist/ProcessEditor.jar \
              btsn.rpso.host/target/btsn.rpso.host.jar \
              tools/ant/lib/ant.jar \
              btsn.common/InfrastructureDefinitionFolder/SingleHost.json; do
            unzip -Z1 "$archive" | grep -Fx "RPSO-v0.1.0/$required"
          done
          unzip -p "$archive" \
            'RPSO-v0.1.0/btsn.common/InfrastructureDefinitionFolder/SingleHost.json' \
            | grep -F '127.0.0.1'
          if unzip -p "$archive" \
            'RPSO-v0.1.0/btsn.common/InfrastructureDefinitionFolder/SingleHost.json' \
            | grep -F '192.168.1.82'; then
            echo 'Unexpected developer LAN address in localhost profile' >&2
            exit 1
          fi

      - name: Publish GitHub Release and attach Windows ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; no change made.'
            exit 0
          fi
          gh release create v0.1.0 \
            release/dist/RPSO-v0.1.0-Windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'RPSO v0.1.0 — Windows Distribution' \
            --notes 'First experimental Windows distribution of Rule-Propagated Service Orchestration (RPSO).

          Includes Process Editor, orchestration hosts, Monitor, example workflows, launchers and bundled Apache Ant.

          Orchestration hosts default to SingleHost (127.0.0.1); test business services hosted on Vercel remain remote. Multi-host orchestration is available by explicit configuration.

          Requirements: Windows and JDK 17 or 21. Extract the entire ZIP, then double-click START_RPSO.bat. See README-FIRST.md in the archive for the illustrated payment-test walkthrough.

          Research and design software, not a production workflow engine. Use test data only.'
