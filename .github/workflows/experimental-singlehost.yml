name: Experimental BTSN SingleHost Build and Run

on:
  pull_request:
    paths:
      - '.github/workflows/experimental-singlehost.yml'
      - 'btsn.workflowEditor/tests/fixtures/terminal_join/mytest.json'
      - 'btsn.services/**'
      - 'btsn.common/**'
      - 'btsn.petrinet.ProjectLoader/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-singlehost-run:
    name: Build packages and execute known-good SingleHost launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout full BTSN source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant
          java -version
          ant -version

      - name: Build the full workflow runtime
        shell: bash
        run: |
          mkdir -p ci-e2e
          set -o pipefail
          ant -noinput -f btsn.services/build.xml build-workflow-runtime 2>&1 | tee ci-e2e/build.log

      - name: Generate real P1 and P2 host ZIP packages
        shell: bash
        run: |
          set -o pipefail
          timeout -k 15s 360s ant -noinput \
            -f btsn.petrinet.ProjectLoader/P1_P2_BuildAndRun.xml \
            -Dhost.address=127.0.0.1 -Dhost.packages=all host-packages \
            2>&1 | tee ci-e2e/packages.log
          find btsn.services/target/host-packages -type f -name '*.zip' -print | tee ci-e2e/packages.txt
          test -s ci-e2e/packages.txt

      - name: Run the complete P1/P2 workflow, including Monitor and collection
        shell: bash
        run: |
          set -uo pipefail
          # The Ant launcher intentionally keeps the hosts running after completing
          # collection. Bound the job and verify completion from the actual runtime log.
          timeout -s TERM -k 15s 240s ant -noinput \
            -f btsn.petrinet.ProjectLoader/P1_P2_BuildAndRun.xml \
            -Dhost.address=127.0.0.1 run-complete-workflow \
            > ci-e2e/run.log 2>&1
          rc=$?
          tail -100 ci-e2e/run.log
          if grep -q 'Phase 3 Complete' ci-e2e/run.log; then
            echo 'Workflow reached Phase 3 collection.'
          else
            echo "Workflow did not complete collection (Ant exit code: $rc)" >&2
            exit 1
          fi

      - name: Retain host ZIP packages and execution logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btsn-singlehost-full-run
          path: |
            ci-e2e/
            btsn.services/target/host-packages/**/*.zip
            btsn.petrinet.ProjectLoader/*Place.out.txt
            btsn.petrinet.ProjectLoader/MonitorService.out.txt
          if-no-files-found: warn
          retention-days: 7
