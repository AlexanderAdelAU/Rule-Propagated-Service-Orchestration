<text x="495" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b2b40">T_out_P5</text>
<path d="M 343 550 L 388 550" fill="none" stroke="#24598e" stroke-width="2" data-source="T_in_P5" data-target="P5" marker-end="url(#flow)"/>
<path d="M 442 550 L 487 550" fill="none" stroke="#24598e" stroke-width="2" data-source="P5" data-target="T_out_P5" marker-end="url(#flow)"/>
