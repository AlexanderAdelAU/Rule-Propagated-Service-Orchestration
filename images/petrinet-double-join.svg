<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">Petri-net model executed by the RPSO fabric</title><desc id="desc">Six circular places have explicit input and output transition bars. T_out_P1 forks true to P2, P3 and P5 or routes false to T_in_Terminate. T_in_P4 joins P2/P3; T_in_P6 joins P4/P5; T_out_P6 terminates. Each local transition-place-transition unit is implemented by the generic host with a bound token operation at its place. Dashed connections are publication channels in RPSO notation. The dot is an illustrative model token; Monitor observes outside the model.</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24598e"/></marker>
<marker id="rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7350a2"/></marker>
<marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#19776e"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="1080" height="630" rx="12" fill="#fafbfc" stroke="#98a7b6" stroke-width="1.5"/>
<text x="38" y="47" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#1b2b40">Executable Petri-net model · T_in → P → T_out at every place</text>
