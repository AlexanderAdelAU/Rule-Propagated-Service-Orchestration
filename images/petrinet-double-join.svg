<path d="M 233 330 L 275 330 L 275 130 L 327 130" fill="none" stroke="#24598e" stroke-width="2" stroke-dasharray="6 4" data-source="T_out_P1" data-target="T_in_P2" marker-end="url(#flow)"/>
<path d="M 233 330 L 327 330" fill="none" stroke="#24598e" stroke-width="2" stroke-dasharray="6 4" data-source="T_out_P1" data-target="T_in_P3" marker-end="url(#flow)"/>
<path d="M 233 330 L 275 330 L 275 550 L 327 550" fill="none" stroke="#24598e" stroke-width="2" stroke-dasharray="6 4" data-source="T_out_P1" data-target="T_in_P5" marker-end="url(#flow)"/>
