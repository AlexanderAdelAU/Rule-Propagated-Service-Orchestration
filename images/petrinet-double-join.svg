<text x="560.0" y="729" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Monitor · observed execution</text>
<text x="560.0" y="755" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Queueing · execution · joins · elapsed time</text>
<path d="M 560 650 L 560 700" fill="none" stroke="#19776e" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#observe)"/>
<text x="577" y="681" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#19776e">collected host observations</text>
<text x="560" y="798" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">Circle: place · Bar: transition · AND: input join · Dot: illustrative token · Dashed blue: publication</text>
<text x="560" y="820" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">Every local triple is supported by the generic fabric; the bound operation gives its place meaning.</text>
