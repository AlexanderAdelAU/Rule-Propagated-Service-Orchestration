<path d="M 629 230 L 668 230" fill="none" stroke="#24598e" stroke-width="2" data-source="T_in_P4" data-target="P4" marker-end="url(#flow)"/>
<path d="M 722 230 L 767 230" fill="none" stroke="#24598e" stroke-width="2" data-source="P4" data-target="T_out_P4" marker-end="url(#flow)"/>
<rect x="300" y="490" width="230" height="125" rx="12" fill="#fafbfc" stroke="#98a7b6" stroke-width="1.5"/>
