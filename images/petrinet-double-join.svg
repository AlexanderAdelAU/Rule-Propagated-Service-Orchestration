<path d="M 172 330 L 217 330" fill="none" stroke="#24598e" stroke-width="2" data-source="P1" data-target="T_out_P1" marker-end="url(#flow)"/>
<rect x="300" y="70" width="230" height="125" rx="12" fill="#fafbfc" stroke="#98a7b6" stroke-width="1.5"/>
<text x="318" y="97" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#1b2b40">Branch 2</text>
