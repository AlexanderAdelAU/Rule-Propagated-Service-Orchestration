<text x="145" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1b2b40">P1</text>
<circle cx="145" cy="342" r="4" fill="#1b2b40"/>
<rect id="T_in_P1" x="57" y="306" width="16" height="48" fill="#24598e"/>
