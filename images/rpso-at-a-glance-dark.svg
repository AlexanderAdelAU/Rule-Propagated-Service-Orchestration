<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">RPSO at a glance</title><desc id="desc">RPSO at a glance. Three columns. Design, in the editor: draw the process, describe each service in a catalogue, deploy each place to a host, and build its rules and launcher. Run, with no central engine: each Node, an input transition, a place and an output transition, runs on its own host, and tokens travel directly from host to host while Monitor gathers records afterwards. Analyse, recorded not simulated: every host records what it did, Monitor gathers the records, the analysis reports queue waits, service times and failures with reasons, checks priority at shared services, and the run replays on the model. Below: services are Java classes inside their host or REST services in any language, unchanged; control flow is BPMN-style, with gateways, forks and joins, merges, and signals that start compensation; beyond one process, several versions run at once with priority, processes change on the fly, and runs span machines and organisations, and everything is a process with no glue code; it deploys on one computer, as host packages, or across machines.</desc>
