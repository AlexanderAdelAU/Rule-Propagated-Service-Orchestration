<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">RPSO at a glance</title><desc id="desc">RPSO at a glance, as a hierarchy. RPSO, Rule-Propagated Service Orchestration: executable Petri nets for live, distributed service orchestration. Three branches. Process design: the process editor, deploy, which chooses each place&#x27;s host, and build, which makes the rules and a launcher. Runtime orchestration: the Node, an input transition, a place and an output transition, executed by an RPSO host, one per host, with no central engine; with BPMN-style control, several versions with priority, changes on the fly, and everything a process. Analysis and insights: execution records, timings and queue waits, and replay of a recorded run, not a simulation. Below the runtime, service integration at the places: Java classes inside their host, REST in any language, existing services unchanged, and business functions such as payment or triage. Then the data: process definitions, catalogues, rules installed on each host, and execution records gathered by Monitor. Then deployment: a local run on one computer, host packages, and hosts on other machines or in other organisations.</desc>
