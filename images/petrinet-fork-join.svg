<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Four-place Boolean-function model with fork and input join</title><desc id="desc">Each of P1 through P4 is a circular place whose bound function independently produces true or false. T_out_P1 forks true into P2 and P3 or terminates false. P2 and P3 publish either result to the input join before P4. The join synchronizes arrivals, not Boolean truth; P4 produces its own Boolean and either outcome reaches final termination. All fifteen model nodes and arcs are represented. Monitor observes outside the token path.</desc>
