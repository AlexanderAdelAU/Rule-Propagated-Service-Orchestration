<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="505" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
<title id="title">Financial loan-application workflow</title><desc id="desc">Submitted applications reach Validation on P1. Valid results fork to Credit Check on P2 and Fraud Check on P3. Underwriting on P4 joins both named results. Approved and conditional outcomes proceed to Decision on P5; invalid and declined applications terminate early. Monitor is not a business activity.</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24598e"/></marker>
<marker id="rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7350a2"/></marker>
<marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#19776e"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="200" width="180" height="90" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="110.0" y="229" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Validation</text>
<text x="110.0" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P1 · validationResults</text>
<rect x="290" y="70" width="210" height="90" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="395.0" y="99" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Credit Check</text>
<text x="395.0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P2 · creditCheckResults</text>
<rect x="290" y="330" width="210" height="90" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="395.0" y="359" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Fraud Check</text>
<text x="395.0" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P3 · fraudCheckResults</text>
<rect x="640" y="200" width="205" height="90" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="742.5" y="229" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Underwriting</text>
<text x="742.5" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P4 · joins both results</text>
<rect x="915" y="200" width="185" height="90" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="1007.5" y="229" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Decision</text>
<text x="1007.5" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P5 · final outcome</text>
<rect x="20" y="50" width="180" height="65" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="110.0" y="79" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Submitted</text>
<rect x="20" y="370" width="180" height="65" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="110.0" y="399" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Invalid: terminate</text>
<rect x="640" y="370" width="205" height="65" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="742.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Declined: terminate</text>
<rect x="915" y="370" width="185" height="65" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="1007.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Complete</text>
<path d="M 110 115 L 110 200" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 200 245 L 290 115" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 200 245 L 290 375" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="234" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">valid:</text>
<text x="234" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">fork</text>
<path d="M 110 290 L 110 370" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="125" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b2b40">invalid</text>
<path d="M 500 115 L 640 245" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 500 375 L 640 245" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="570" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">join both</text>
<text x="570" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">inputs</text>
<path d="M 845 245 L 915 245" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="880" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">approved /</text>
<text x="880" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">conditional</text>
<path d="M 742 290 L 742 370" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="757" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b2b40">declined</text>
<path d="M 1007 290 L 1007 370" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="560" y="482" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Activity boxes abbreviate local T_in → P → T_out roles; arrows show logical publication.</text>
</svg>
