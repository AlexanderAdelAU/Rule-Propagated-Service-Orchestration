<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">Emergency department patient workflow</title><desc id="desc">Triage on P1 chooses direct treatment or a three-way diagnostic fork. Laboratory on P2, Cardiology on P3 and Radiology on P4 feed a synchronization join at Diagnosis on P5. Treatment on P6 accepts either the diagnosis path or direct triage, then terminates the patient workflow. Monitor observes separately.</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24598e"/></marker>
<marker id="rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7350a2"/></marker>
<marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#19776e"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="300" width="135" height="75" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="87.5" y="329" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Patient arrival</text>
<rect x="205" y="290" width="165" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="287.5" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Triage</text>
<text x="287.5" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P1 · select path</text>
<rect x="450" y="155" width="165" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="532.5" y="184" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Laboratory</text>
<text x="532.5" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P2</text>
<rect x="450" y="290" width="165" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="532.5" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Cardiology</text>
<text x="532.5" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P3</text>
<rect x="450" y="425" width="165" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="532.5" y="454" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Radiology</text>
<text x="532.5" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P4</text>
<rect x="745" y="290" width="165" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="827.5" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Diagnosis</text>
<text x="827.5" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P5 · join all three</text>
<rect x="950" y="290" width="150" height="100" rx="8" fill="#edf7f0" stroke="#60738a" stroke-width="1.5"/>
<text x="1025.0" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Treatment</text>
<text x="1025.0" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">P6 · either input</text>
<rect x="950" y="480" width="150" height="65" rx="8" fill="#f5f6f8" stroke="#60738a" stroke-width="1.5"/>
<text x="1025.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">Terminate</text>
<path d="M 155 338 L 205 338" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 370 340 L 450 205" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 370 340 L 450 340" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 370 340 L 450 475" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="405" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">fork</text>
<text x="285" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">STANDARD_WORKFLOW</text>
<text x="285" y="463" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">parallel diagnostics</text>
<path d="M 615 205 L 745 340" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 615 340 L 745 340" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 615 475 L 745 340" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="680" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">all 3</text>
<text x="680" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b2b40">results</text>
<path d="M 910 340 L 950 340" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<path d="M 285 290 L 285 90 L 1025 90 L 1025 290" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="655" y="74" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#1b2b40">DIRECT_TO_TREATMENT · executeDirectTreatment</text>
<path d="M 1025 390 L 1025 480" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="560" y="576" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Treatment merges alternatives; Diagnosis synchronizes all diagnostic inputs. Monitor is outside this path.</text>
</svg>
