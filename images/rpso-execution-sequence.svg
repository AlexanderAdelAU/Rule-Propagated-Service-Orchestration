<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">RPSO execution sequence</title><desc id="desc">Three logical lifelines within one generic host: input transition T_in, place function P, and output transition T_out. T_in receives and buffers a token, synchronizes the required inputs, and invokes P with arguments. P performs its function or calls the bound service, then returns the result. T_in hands the result to T_out and ends its activation. T_out applies routing rules, publishes tokens or records termination, then ends its activation. The activation bars are light blue; their lengths are conceptual, not measured durations.</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24598e"/></marker>
<marker id="rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7350a2"/></marker>
<marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#19776e"/></marker>
<marker id="ack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="55" y="20" width="210" height="70" rx="8" fill="#edf3fa" stroke="#60738a" stroke-width="1.5"/>
<text x="160.0" y="49" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">T_in</text>
<text x="160.0" y="75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Input transition</text>
<line x1="160" y1="90" x2="160" y2="865" stroke="#98a7b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="345" y="20" width="210" height="70" rx="8" fill="#edf3fa" stroke="#60738a" stroke-width="1.5"/>
<text x="450.0" y="49" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">P</text>
<text x="450.0" y="75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Place function</text>
<line x1="450" y1="90" x2="450" y2="865" stroke="#98a7b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="635" y="20" width="210" height="70" rx="8" fill="#edf3fa" stroke="#60738a" stroke-width="1.5"/>
<text x="740.0" y="49" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1b2b40">T_out</text>
<text x="740.0" y="75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b2b40">Output transition</text>
<line x1="740" y1="90" x2="740" y2="865" stroke="#98a7b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="151" y="105" width="18" height="430" fill="#e1edf9" stroke="#24598e" stroke-width="1.5"/>
<rect x="441" y="300" width="18" height="160" fill="#e1edf9" stroke="#24598e" stroke-width="1.5"/>
<rect x="731" y="535" width="18" height="300" fill="#e1edf9" stroke="#24598e" stroke-width="1.5"/>
<rect x="60.0" y="120" width="200" height="66" fill="#f5f6f8" stroke="#98a7b6" stroke-width="1.2"/>
<text x="160" y="146" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Receive and buffer</text>
<text x="160" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">token</text>
<rect x="45.0" y="195" width="230" height="66" fill="#f5f6f8" stroke="#98a7b6" stroke-width="1.2"/>
<text x="160" y="221" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Synchronize required</text>
<text x="160" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">inputs</text>
<path d="M 169 300 L 441 300" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="305.0" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Invoke with arguments</text>
<rect x="345.0" y="345" width="210" height="66" fill="#f5f6f8" stroke="#98a7b6" stroke-width="1.2"/>
<text x="450" y="371" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Perform function</text>
<text x="450" y="395" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">or call bound service</text>
<path d="M 441 460 L 169 460" fill="none" stroke="#24598e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flow)"/>
<text x="305.0" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Return result</text>
<path d="M 169 535 L 731 535" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="450.0" y="519" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Hand off result</text>
<rect x="635.0" y="575" width="210" height="42" fill="#f5f6f8" stroke="#98a7b6" stroke-width="1.2"/>
<text x="740" y="601" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1b2b40">Apply routing rules</text>
<rect x="50" y="655" width="800" height="190" fill="none" stroke="#98a7b6" stroke-width="1.5"/>
<text x="70" y="683" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#1b2b40">alt: continue workflow</text>
<text x="70" y="719" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1b2b40">Publish token or fork children</text>
<path d="M 749 705 L 800 705 L 800 733 L 749 733" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<line x1="50" y1="750" x2="850" y2="750" stroke="#98a7b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="70" y="778" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#1b2b40">OR end workflow</text>
<text x="70" y="814" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1b2b40">Record termination</text>
<path d="M 749 798 L 800 798 L 800 826 L 749 826" fill="none" stroke="#24598e" stroke-width="2" marker-end="url(#flow)"/>
<text x="450" y="898" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#1b2b40">Shaded bars: activation for one invocation · Vertical order: sequence, not measured time</text>
</svg>
