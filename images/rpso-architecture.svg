<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">RPSO responsibility boundaries</title><desc id="desc">Process and deployment definitions install local rules in a generic orchestration host. The host invokes a separately packaged business JAR in-process, routes token publications to other hosts, and supplies collected observations to Monitor outside the business path.</desc>
