<text x="768" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#e9edf3">Paid</text>
<rect x="712" y="216" width="112" height="40" rx="8" fill="#0f141c" stroke="#c5cdd9" stroke-width="1.5"/>
<text x="768" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#e9edf3">Declined</text>
<path d="M 588 166 L 612 166 L 642 126 L 710 126" fill="none" stroke="#e9edf3" stroke-width="2" marker-end="url(#f-ink)"/>
