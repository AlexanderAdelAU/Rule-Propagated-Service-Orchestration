<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Start with one service</title><desc id="desc">Start with one service. Inside an RPSO test workflow, the PAYMENTS event generator sends tokens to a logical Node, executed by a generic RPSO orchestration host: T_in, the Payment place and T_out. T_out routes each payment to Paid or Declined. The Payment place calls the existing remote Payment Service, unchanged, by REST request and response. The host records the execution, which Monitor gathers for analysis: timings, queue waits and replay.</desc><defs>
<marker id="f-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e9edf3"/></marker>
<marker id="f-services" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa9e6"/></marker>
<marker id="f-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c5cdd9"/></marker>
</defs><rect width="100%" height="100%" fill="#0f141c"/>
<rect x="30" y="30" width="820" height="262" rx="14" fill="#161d28" stroke="#3a4558" stroke-width="1.5"/>
<text x="52" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#c5cdd9">RPSO TEST WORKFLOW</text>
