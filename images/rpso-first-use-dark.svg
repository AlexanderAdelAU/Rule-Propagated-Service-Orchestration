<text x="108" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#e9edf3">PAYMENTS</text>
<text x="108" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#c5cdd9">event generator</text>
<rect x="200" y="84" width="410" height="182" rx="14" fill="#0f141c" stroke="#b28cf0" stroke-width="2"/>
<text x="222" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#b28cf0">Logical Node</text>
<text x="405" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#c5cdd9">executed by a generic RPSO orchestration host</text>
<rect x="222" y="158" width="70" height="36" rx="6" fill="#161d28" stroke="#c5cdd9" stroke-width="1.5"/>
<text x="257" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e9edf3">T_in</text>
<rect x="518" y="158" width="70" height="36" rx="6" fill="#161d28" stroke="#c5cdd9" stroke-width="1.5"/>
<text x="553" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e9edf3">T_out</text>
<circle cx="405" cy="176" r="40" fill="#161d28" stroke="#b28cf0" stroke-width="2"/>
<text x="405" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#e9edf3">Payment</text>
<text x="405" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#c5cdd9">Place</text>
