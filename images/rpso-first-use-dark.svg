<text x="636" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#5aa9e6">REST request / response</text>
<rect x="240" y="350" width="330" height="64" rx="12" fill="#161d28" stroke="#f08a4b" stroke-width="2"/>
<text x="405" y="376" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e9edf3">Monitor / Analysis</text>
<text x="405" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#c5cdd9">timings · queue waits · replay</text>
<path d="M 405 266 L 405 348" fill="none" stroke="#c5cdd9" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#f-muted)"/>
<text x="418" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#c5cdd9">the host records the execution</text>
